<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ</title>

<meta name="description" content="MUZAFFAR GLOBAL TRADE UZ — online savdo, xizmatlar, biznes loyihalar va investitsiya platformasi.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#172033;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

header{
    background:#0b1f3a;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.navbar{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:.5px;
}

.logo span{
    color:#27c3ff;
}

nav{
    display:flex;
    gap:22px;
    align-items:center;
}

nav a{
    font-size:15px;
    color:white;
    transition:.3s;
}

nav a:hover{
    color:#27c3ff;
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#0b1f3a,#124b7a,#087fa8);
    color:white;
    padding:90px 0;
}

.hero-content{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:40px;
    align-items:center;
}

.hero h1{
    font-size:48px;
    line-height:1.15;
    margin-bottom:20px;
}

.hero h1 span{
    color:#45d7ff;
}

.hero p{
    font-size:19px;
    max-width:650px;
    color:#e8f7ff;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 24px;
    border-radius:10px;
    font-weight:bold;
    border:2px solid transparent;
    transition:.3s;
}

.btn-primary{
    background:#19b7e8;
    color:white;
}

.btn-primary:hover{
    background:#0e9dca;
    transform:translateY(-2px);
}

.btn-light{
    border-color:white;
    color:white;
}

.btn-light:hover{
    background:white;
    color:#0b1f3a;
}

.hero-card{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(8px);
}

.hero-card h3{
    font-size:25px;
    margin-bottom:15px;
}

.hero-card p{
    font-size:16px;
    margin-bottom:0;
}

/* SECTIONS */

section{
    padding:75px 0;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:34px;
    margin-bottom:10px;
    color:#0b1f3a;
}

.section-title p{
    color:#657083;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 8px 30px rgba(20,40,70,.08);
    transition:.3s;
    border:1px solid #e8edf5;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 15px 35px rgba(20,40,70,.14);
}

.icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e8f8ff;
    color:#079bd0;
    border-radius:14px;
    font-size:26px;
    margin-bottom:20px;
}

.card h3{
    font-size:21px;
    margin-bottom:10px;
    color:#14233b;
}

.card p{
    color:#687386;
    margin-bottom:20px;
}

.card a{
    color:#079bd0;
    font-weight:bold;
}

/* SHOP */

.shop{
    background:#eef5fa;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.product{
    background:white;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(20,40,70,.08);
}

.product-image{
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#dff7ff,#eef2ff);
    font-size:65px;
}

.product-body{
    padding:23px;
}

.product-body h3{
    margin-bottom:8px;
}

.price{
    color:#079bd0;
    font-size:21px;
    font-weight:bold;
    margin:12px 0 18px;
}

.buy-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:9px;
    background:#0b1f3a;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.buy-btn:hover{
    background:#079bd0;
}

/* BUSINESS */

.business-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.business-box{
    background:white;
    padding:30px;
    border-radius:18px;
    border-left:5px solid #079bd0;
    box-shadow:0 8px 25px rgba(20,40,70,.07);
}

.business-box h3{
    margin-bottom:10px;
}

/* INVESTMENT */

.investment{
    background:#0b1f3a;
    color:white;
}

.investment .section-title h2{
    color:white;
}

.investment .section-title p{
    color:#b9c8d8;
}

.invest-card{
    background:#132f52;
    border:1px solid #284b70;
    padding:30px;
    border-radius:18px;
}

.invest-card h3{
    margin-bottom:12px;
    color:#4bd6ff;
}

/* CONTACT */

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.contact-box{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(20,40,70,.08);
}

.contact-item{
    margin:18px 0;
}

.contact-item strong{
    display:block;
    color:#0b1f3a;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #d9e0e8;
    border-radius:9px;
    font-family:inherit;
    font-size:15px;
}

.contact-form textarea{
    height:130px;
    resize:vertical;
}

.contact-form button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#079bd0;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */

footer{
    background:#07172b;
    color:#cbd6e2;
    padding:40px 0 20px;
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:35px;
    margin-bottom:30px;
}

footer h3{
    color:white;
    margin-bottom:12px;
}

footer a{
    display:block;
    margin:7px 0;
}

footer a:hover{
    color:#45d7ff;
}

    text-align:center;
    border-top:1px solid #21344c;
    padding-top:
