<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#0b1f3a;
    color:white;
    padding:18px 6%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#20c997;
}

nav{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
}

nav a:hover{
    color:#20c997;
}

.hero{
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 6%;
    background:linear-gradient(135deg,#0b1f3a,#123d68);
    color:white;
}

.hero-content{
    max-width:850px;
}

.hero h1{
    font-size:52px;
    margin-bottom:20px;
}

.hero h1 span{
    color:#20c997;
}

.hero p{
    font-size:20px;
    line-height:1.7;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 25px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:#20c997;
    color:#082032;
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.btn-light{
    border:2px solid white;
    color:white;
}

.btn-light:hover{
    background:white;
    color:#0b1f3a;
}

section{
    padding:70px 6%;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:35px;
    color:#0b1f3a;
    margin-bottom:12px;
}

.section-title p{
    color:#667085;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
}

.icon{
    font-size:42px;
    margin-bottom:18px;
}

.card h3{
    color:#0b1f3a;
    margin-bottom:12px;
    font-size:22px;
}

.card p{
    color:#667085;
    line-height:1.6;
}

.price{
    color:#20a879;
    font-size:21px;
    font-weight:bold;
    margin:18px 0;
}

.buy-btn{
    display:block;
    text-align:center;
    padding:12px;
    background:#0b1f3a;
    color:white;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
}

.buy-btn:hover{
    background:#20c997;
    color:#082032;
}

.about{
    background:white;
}

.about-content{
    max-width:900px;
    margin:auto;
    text-align:center;
}

.about-content p{
    line-height:1.8;
    color:#5d6878;
    font-size:17px;
}

.stats{
