<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#172033;
line-height:1.6;
}

header{
background:linear-gradient(135deg,#071a35,#0b4f8a);
color:white;
padding:18px 20px;
position:sticky;
top:0;
z-index:1000;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.logo{
font-size:20px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin:0 7px;
font-weight:bold;
}

.hero{
background:linear-gradient(135deg,#071a35,#1261a0);
color:white;
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero p{
max-width:800px;
margin:auto;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:13px 25px;
background:#f4b400;
color:#111;
text-decoration:none;
border-radius:8px;
font-weight:bold;
border:none;
cursor:pointer;
}

section{
max-width:1200px;
margin:auto;
padding:55px 20px;
}

.title{
text-align:center;
font-size:30px;
margin-bottom:30px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
padding:22px;
border-radius:12px;
text-align:center;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.icon{
font-size:50px;
margin-bottom:10px;
}

.product h3{
color:#0b4f8a;
margin-bottom:8px;
}

.price{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.product button{
margin-top:15px;
padding:10px 18px;
border:none;
border-radius:7px;
background:#0b4f8a;
color:white;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card h3{
color:#0b4f8a;
margin-bottom:10px;
}

.cart-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.cart-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #ddd;
}

.remove{
background:#d9534f;
color:white;
border:none;
padding:5px 10px;
border-radius:5px;
cursor:pointer;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.order-form{
display:grid;
gap:12px;
margin-top:20px;
}

.order-form input,
.order-form textarea{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}

.order-form textarea{
min-height:100px;
resize:vertical;
}

.contact{
background:#071a35;
color:white;
max-width:none;
text-align:center;
}

footer{
background:#030d1c;
color:white;
text-align:center;
padding:25px;
}

#cartButton{
position:fixed;
right:20px;
bottom:20px;
background:#f4b400;
color:#111;
padding:14px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
z-index:2000;
}

@media(max-width:700px){

.nav{
flex-direction:column;
}
