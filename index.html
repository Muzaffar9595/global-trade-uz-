<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ | Global Business Platform</title>

<meta name="description"
content="MUZAFFAR GLOBAL TRADE UZ — xalqaro savdo, eksport, import, investitsiya, turizm, ta'lim va global biznes hamkorlik platformasi.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0
}

html{
 scroll-behavior:smooth
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:#eef3f8;
 color:#172033;
 line-height:1.65;
 overflow-x:hidden
}

button,input,textarea,select{
 font-family:inherit
}

header{
 position:sticky;
 top:0;
 z-index:9999;
 background:rgba(3,16,35,.97);
 backdrop-filter:blur(18px);
 color:#fff;
 padding:12px 10px;
 box-shadow:0 6px 35px rgba(0,0,0,.28)
}

.header-inner{
 max-width:1400px;
 margin:auto
}

.brand{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:13px;
 margin-bottom:12px
}

.logo{
 width:68px;
 height:68px;
 flex:none;
 filter:drop-shadow(0 0 15px rgba(230,190,80,.35))
}

.brand h1{
 font-size:22px;
 letter-spacing:1px
}

.brand small{
 display:block;
 opacity:.72;
 font-size:10px;
 letter-spacing:2.5px
}

nav{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:5px
}

nav button{
 border:0;
 background:transparent;
 color:#fff;
 padding:8px 10px;
 border-radius:9px;
 cursor:pointer;
 font-size:12px;
 transition:.25s
}

nav button:hover,
nav button.active{
 background:rgba(255,255,255,.16);
 transform:translateY(-1px)
}

.cart-button{
 background:#fff!important;
 color:#082d52!important;
 font-weight:bold
}

.cart-count{
 background:#e53935;
 color:#fff;
 border-radius:20px;
 padding:2px 7px
}

main{
 max-width:1400px;
 margin:auto;
 padding:28px 16px 80px
}

.page{
 display:none;
 animation:pageIn .45s ease
}

.page.active{
 display:block
}

@keyframes pageIn{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}

/* HERO */

.hero{
 position:relative;
 overflow:hidden;
 min-height:650px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 border-radius:30px;
 padding:55px 20px;
 color:#fff;
 background:
 linear-gradient(rgba(2,18,39,.73),rgba(2,18,39,.94)),
 url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1800&q=85")
 center/cover;
 box-shadow:0 20px 65px rgba(0,0,0,.22)
}

.hero:before{
 content:"";
 position:absolute;
 width:580px;
 height:580px;
 border:1px solid rgba(255,255,255,.14);
 border-radius:50%;
 animation:spin 25s linear infinite
}

.hero:after{
 content:"";
 position:absolute;
 width:850px;
 height:850px;
 border:1px solid rgba(216,180,91,.1);
 border-radius:50%;
 animation:spinReverse 35s linear infinite
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@keyframes spinReverse{
 to{transform:rotate(-360deg)}
}

.hero-content{
 position:relative;
 z-index:2;
 max-width:980px
}

.hero-logo{
 width:135px;
 height:135px;
 margin:auto;
 animation:float 3s ease-in-out infinite
}

@keyframes float{
 50%{transform:translateY(-10px)}
}

.hero h2{
 font-size:47px;
 margin:18px 0;
 background:linear-gradient(90deg,#fff,#e0bf62,#fff);
 -webkit-background-clip:text;
 color:transparent
}

.hero p{
 font-size:19px;
 max-width:850px;
 margin:auto;
 color:#e1eaf4
}

.hero-buttons{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:12px;
 margin-top:28px
}

/* COMMON */

.btn{
 display:inline-block;
 border:0;
 border-radius:10px;
 padding:13px 21px;
 background:#0b315b;
 color:#fff;
 cursor:pointer;
 font-weight:bold;
 font-size:14px;
 transition:.25s
}

.btn:hover{
 transform:translateY(-3px);
 box-shadow:0 9px 24px rgba(0,0,0,.18)
}

.btn.gold{
 background:linear-gradient(135deg,#947126,#dfc266)
}

.btn.green{background:#198754}
.btn.gray{background:#607d9c}
.btn.red{background:#d32f2f}

.section{
 margin-top:35px
}

.section-title{
 text-align:center;
 margin-bottom:25px
}

.section-title h2{
 font-size:31px;
 color:#092d54;
 margin-bottom:7px
}

.section-title p{
 color:#68778a
}

.cards,
.products,
.country-grid,
.language-grid,
.office-grid,
.team-grid,
.project-grid,
.idea-grid,
.timeline,
.solution-grid,
.status-grid,
.plan-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(235px,1fr));
 gap:20px
}

.card,
.product,
.form-box,
.cart-box,
.country,
.language,
.office,
.team,
.project,
.idea,
.info-box,
.timeline-item,
.solution,
.status-card,
.plan-card{
 background:#fff;
 border-radius:18px;
 padding:24px;
 box-shadow:0 7px 27px rgba(12,35,65,.08);
 transition:.25s
}

.card:hover,
.office:hover,
.project:hover,
.idea:hover,
.country:hover,
.solution:hover{
 transform:translateY(-5px);
 box-shadow:0 16px 38px rgba(12,35,65,.14)
}

.card h3,
.project h3,
.idea h3,
.country h3,
.office h3,
.team h3,
.solution h3,
.status-card h3{
 color:#092d54;
 margin-bottom:9px
}

.icon{
 font-size:42px;
 margin-bottom:10px
}

.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:15px;
 margin-top:28px
}

.stat{
 text-align:center;
 background:linear-gradient(135deg,#082b50,#124d81);
 color:#fff;
 padding:25px 15px;
 border-radius:17px
}

.stat strong{
 display:block;
 font-size:31px
}

.stat span{
 font-size:13px;
 opacity:.85
}

.photo{
 height:210px;
 border-radius:14px;
 overflow:hidden;
 margin-bottom:15px;
 background:#e8eef5
}

.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.5s
}

.photo img:hover{
 transform:scale(1.06)
}

.office{
 padding:15px
}

.office .photo{
 height:195px
}

.team{
 text-align:center
}

.avatar{
 width:125px;
 height:125px;
 border-radius:50%;
 margin:0 auto 15px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:60px;
 background:linear-gradient(135deg,#d7e4f1,#fff);
 border:4px solid #d4b35c
}

.flag{
 font-size:45px;
 margin-bottom:8px
}

.language{
 text-align:center
}

.quote{
 font-size:20px;
 font-style:italic;
 color:#34506e;
 text-align:center;
 padding:30px;
 background:#fff;
 border-radius:18px;
 box-shadow:0 7px 25px rgba(0,0,0,.06)
}

.status-box{
 background:linear-gradient(135deg,#fff,#f2f6fb);
 border-left:5px solid #d0a944;
 padding:23px;
 border-radius:12px
}

/* VIDEO */

.video-card{
 background:#061b36;
 border-radius:20px;
 overflow:hidden;
 color:#fff;
 box-shadow:0 10px 30px rgba(0,0,0,.18)
}

.video-screen{
 height:240px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
 background:
 radial-gradient(circle at center,rgba(30,100,160,.7),transparent 45%),
 linear-gradient(135deg,#031326,#0d4776);
 position:relative;
 overflow:hidden
}

.video-screen:before{
 content:"";
 position:absolute;
 width:180px;
 height:180px;
 border:1px solid rgba(255,255,255,.25);
 border-radius:50%;
 animation:spin 10s linear infinite
}

.play{
 position:relative;
 z-index:2;
 width:72px;
 height:72px;
 border-radius:50%;
 background:#fff;
 color:#0a3158;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:29px;
 margin:auto;
 cursor:pointer
}

.video-info{
 padding:18px
}

.video-info h3{
 color:#fff;
 margin-bottom:7px
}

/* DOCUMENT PLAN */

.plan-card{
 border-left:4px solid #c39b3b
}

.plan-number{
 color:#bd9235;
 font-size:13px;
 font-weight:bold
}

.plan-card h3{
 color:#092d54;
 margin:5px 0
}

/* TABLE */

.table-wrap{
 overflow-x:auto
}

table{
 width:100%;
 border-collapse:collapse;
 background:#fff;
 border-radius:12px;
 overflow:hidden
}

th,td{
 padding:12px;
 border-bottom:1px solid #ddd;
 text-align:left
}

th{
 background:#092d54;
 color:#fff
}

/* PRODUCT */

.product:hover{
 transform:translateY(-5px)
}

.product-image{
 height:175px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#eef3f7;
 border-radius:13px;
 overflow:hidden;
 margin-bottom:15px;
 font-size:60px
}

.product-image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.product-description{
 color:#68778a;
 min-height:45px
}

.price{
 font-size:19px;
 font-weight:bold;
 color:#092d54;
 margin-top:12px
}

.form-box{
 max-width:820px;
 margin:0 auto 25px
}

label{
 display:block;
 font-weight:bold;
 margin-top:10px
}

input,
textarea,
select{
 width:100%;
 padding:13px;
 margin:7px 0 13px;
 border:1px solid #d0d8e2;
 border-radius:9px;
 font-size:15px;
 background:#fff
}

textarea{
 min-height:110px;
 resize:vertical
}

.search{
 width:100%;
 margin-bottom:20px
}

.status{
 margin-top:13px;
 font-weight:bold
}

/* CART */

.empty{
 background:#fff;
 padding:30px;
 border-radius:15px;
 text-align:center;
 color:#68778a
}

.cart-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 padding:16px 0;
 border-bottom:1px solid #e1e6ec
}

.cart-name{
 font-weight:bold;
 color:#092d54
}

.quantity{
 display:flex;
 align-items:center;
 gap:7px
}

.quantity button{
 width:35px;
 height:35px;
 border:0;
 border-radius:7px;
 background:#e6edf5;
 cursor:pointer
}

.total{
 text-align:right;
 font-size:22px;
 font-weight:bold;
 color:#092d54;
 margin-top:20px
}

.checkout{
 display:none;
 margin-top:25px
}

.summary{
 background:#f2f6fa;
 padding:15px;
 border-radius:10px;
 margin-bottom:18px
}

/* MODAL */

#toast{
 position:fixed;
 right:20px;
 bottom:20px;
 z-index:99999;
 background:#082b50;
 color:#fff;
 padding:15px 20px;
 border-radius:12px;
 box-shadow:0 10px 30px rgba(0,0,0,.25);
 display:none;
 max-width:330px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 z-index:10000;
 align-items:center;
 justify-content:center;
 padding:20px
}

.modal-box{
 background:#fff;
 border-radius:20px;
 padding:25px;
 max-width:850px;
 width:100%;
 max-height:90vh;
 overflow:auto
}

.close{
 float:right;
 border:0;
 background:#eee;
 width:35px;
 height:35px;
 border-radius:50%;
 cursor:pointer;
 font-size:20px
}

.media-script{
 background:#061b36;
 color:#fff;
 padding:22px;
 border-radius:15px;
 margin-top:18px
}

/* FOOTER */

footer{
 background:#04162d;
 color:#fff;
 text-align:center;
 padding:45px 15px
}

.footer-logo{
 width:75px;
 margin:auto auto 12px
}

footer p{
 margin:6px;
 opacity:.85
}

.divider{
 height:1px;
 background:#dce3ea;
 margin:30px 0
}

.notice{
 background:#fff8df;
 border:1px solid #e3c76c;
 padding:18px;
 border-radius:14px;
 margin:20px 0
}

.highlight{
 background:linear-gradient(135deg,#082b50,#124d81);
 color:#fff;
 border-radius:20px;
 padding:30px
}

.highlight h2,
.highlight h3{
 color:#fff
}

/* MOBILE */

@media(max-width:650px){

 header{
  padding:9px 6px
 }

 .brand h1{
  font-size:15px
 }

 .brand small{
  font-size:8px
 }

 .logo{
  width:53px;
  height:53px
 }

 nav button{
  font-size:10px;
  padding:6px
 }

 .hero{
  min-height:590px;
  padding:40px 15px
 }

 .hero-logo{
  width:105px;
  height:105px
 }

 .hero h2{
  font-size:29px
 }

 .hero p{
  font-size:16px
 }

 .section-title h2{
  font-size:25px
 }

 .cart-item{
  flex-direction:column;
  align-items:flex-start
 }

 .quantity{
  align-self:flex-end
 }
}
</style>
</head>
