<script>

let cart = [];

/* MAHSULOTNI SAVATGA QO'SHISH */

function addToCart(product) {

  cart.push(product);

  updateCart();

  alert("✅ " + product + " savatga qo‘shildi!");
}


/* SAVAT SONINI YANGILASH */

function updateCart() {

  const cartCount =
    document.getElementById("cartCount");

  if (cart.length === 0) {

    cartCount.innerText =
      "Savat hozircha bo‘sh.";

  } else {

    cartCount.innerText =
      "🛒 Savatda " +
      cart.length +
      " ta mahsulot/xizmat mavjud.";

  }
}


/* SAVATNI KO'RISH */

function showCart() {

  if (cart.length === 0) {

    alert("🛒 Savat hozircha bo‘sh.");

    return;
  }

  let list = "";

  cart.forEach(function(item, index) {

    list +=
      (index + 1) +
      ". " +
      item +
      "\n";

  });

  alert(
    "🛒 SAVAT\n\n" +
    list +
    "\nBuyurtma berish uchun OK tugmasini bosing."
  );

  openOrderForm();
}


/* BUYURTMA FORMASINI OCHISH */

function openOrderForm() {

  const form =
    document.getElementById("orderForm");

  if (form) {

    form.style.display = "block";

    form.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* BUYURTMA YUBORISH */

function submitOrder(event) {

  event.preventDefault();

  const name =
    document.getElementById("customerName").value;

  const phone =
    document.getElementById("customerPhone").value;

  const city =
    document.getElementById("customerCity").value;

  if (!name || !phone || !city) {

    alert("⚠️ Iltimos, barcha maydonlarni to‘ldiring.");

    return;
  }

  alert(
    "✅ Buyurtma ma’lumotlari qabul qilindi!\n\n" +
    "Mijoz: " + name + "\n" +
    "Telefon: " + phone + "\n" +
    "Manzil: " + city
  );

}


/* KATEGORIYA FILTRI */

function filterProducts(category) {

  const products =
    document.querySelectorAll(".product-card");

  products.forEach(function(product) {

    if (
      category === "all" ||
      product.dataset.category === category
    ) {

      product.style.display = "block";

    } else {

      product.style.display = "none";

    }

  });

}


/* MAHSULOT QIDIRISH */

function searchProducts() {

  const search =
    document
      .getElementById("searchProduct")
      .value
      .toLowerCase();

  const products =
    document.querySelectorAll(".product-card");

  products.forEach(function(product) {

    const name =
      product.dataset.name.toLowerCase();

    if (name.includes(search)) {

      product.style.display = "block";

    } else {

      product.style.display = "none";

    }

  });

}

</script>
