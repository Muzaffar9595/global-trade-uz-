<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #075e54, #0b8f7a);
    color: white;
    padding: 18px 7%;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
    font-weight: bold;
}

nav a:hover {
    text-decoration: underline;
}

/* HERO */

.hero {
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 7%;
    background: linear-gradient(135deg, #e8fff9, #ffffff);
}

.hero-content {
    max-width: 850px;
}

.hero h1 {
    font-size: 48px;
    color: #075e54;
    margin-bottom: 20px;
}

.hero p {
    font-size: 20px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    background: #075e54;
    color: white;
    padding: 13px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
}

.btn:hover {
    background: #064b44;
}

/* UMUMIY SECTION */

section {
    padding: 70px 7%;
}

.section-title {
    text-align: center;
    color: #075e54;
    font-size: 34px;
    margin-bottom: 40px;
}

/* ABOUT */

.about {
    background: white;
    text-align: center;
}

.about p {
    max-width: 850px;
    margin: auto;
    font-size: 18px;
    line-height: 1.8;
}

/* SHOP */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.product h3 {
    color: #075e54;
    margin-bottom: 10px;
}

.product p {
    color: #555;
    margin-bottom: 15px;
    line-height: 1.5;
}

.price {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* SERVICES */

.services {
    background: #ffffff;
}

.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.service {
    background: #f4f7fb;
    border-radius: 15px;
    padding: 30px 22px;
    text-align: center;
    border: 1px solid #e3e8ee;
    transition: 0.3s;
}

.service:hover {
    transform: translateY(-7px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.10);
}

.service-icon {
    font-size: 52px;
    margin-bottom: 18px;
}

.service h3 {
    color: #075e54;
    font-size: 21px;
    margin-bottom: 12px;
}

.service p {
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
}

/* BUSINESS */

.business {
    background: #e8fff9;
}

.business-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
}

.business-card {
    background: white;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
}

.business-card h3 {
    color: #075e54;
    margin-bottom: 12px;
}

.business-card p {
    line-height: 1.6;
}

/* INVESTMENT */

.investment {
    background: white;
    text-align: center;
}

.investment p {
    max-width: 800px;
    margin: auto;
    font-size: 18px;
    line-height: 1.8;
}

/* CONTACT */

.contact {
    background: #075e54;
    color: white;
}

.contact .section-title {
    color: white;
}

.contact-box {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

.contact-box input,
.contact-box textarea {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.contact-box textarea {
    min-height: 120px;
    resize: vertical;
}

/* CART */

.cart {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #075e54;
    color: white;
    padding: 15px 20px;
    border-radius: 50px;
    cursor: pointer;
    z-index: 2000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    font-weight: bold;
}

.cart-panel {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 85px;
    width: 340px;
    max-width: calc(100% - 40px);
    background: white;
    border-radius: 15px;
    padding: 22px;
    z-index: 2000;
    box-shadow: 0 5px 30px rgba(0,0,0,0.25);
}

.cart-panel h3 {
    color: #075e54;
    margin-bottom: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.cart-total {
    font-size: 19px;
    font-weight: bold;
    margin: 18px 0;
}

/* FOOTER */

footer {
    background: #102a2a;
    color: white;
    text-align: center;
    padding: 25px;
}

footer p {
    margin: 5px;
}

/* MOBILE */

        flex-direction: column;
    }

    nav {
        text-align: center;

        margin: 6
