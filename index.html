<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUZAFFAR GLOBAL TRADE UZ</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #075e54, #0b8f7a);
    color: white;
    padding: 18px 7%;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-weight: bold;
}

nav a:hover {
    text-decoration: underline;
}

.hero {
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 7%;
    background: linear-gradient(135deg, #e8fff9, #ffffff);
}

.hero-content {
    max-width: 850px;
}

.hero h1 {
    font-size: 48px;
    color: #075e54;
    margin-bottom: 20px;
}

.hero p {
    font-size: 20px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    background: #075e54;
    color: white;
    padding: 14px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

.btn:hover {
    background: #064b44;
}

section {
    padding: 70px 7%;
}

.section-title {
    text-align: center;
    color: #075e54;
    font-size: 34px;
    margin-bottom: 40px;
}

.about {
    background: white;
    text-align: center;
}

.about p {
    max-width: 850px;
    margin: auto;
    font-size: 18px;
    line-height: 1.8;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.product h3 {
    color: #075e54;
    margin-bottom: 10px;
}

.product p {
    color: #555;
    margin-bottom: 15px;
    line-height: 1.5;
}

.price {
    font-size: 22px;
    font-weight: bold;
    color: #111;
    margin-bottom: 15px;
}

.services {
    background: #ffffff;
}

.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.service {
    padding: 25px;
    background: #f4f7fb;
    border-radius: 12px;
    text-align: center;
}

.service-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.service h3 {
    color: #075e54;
    margin-bottom: 10px;
}

.business
