<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --dark:#050b14;
    --blue:#0b1c32;
    --gold:#f5c451;
    --gold2:#ffd86b;
    --white:#ffffff;
    --gray:#aebbd0;
    --line:#243854;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--white);
    background:
    radial-gradient(circle at 50% 0%,#234c79 0%,#0b1829 35%,#050b14 75%);
    line-height:1.6;
    overflow-x:hidden;
}

/* YULDUZLAR */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
    radial-gradient(#fff 1px,transparent 1px);
    background-size:65px 65px;
    animation:stars 15s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(65px)}
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,11,20,.90);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--gold);
    text-decoration:none;
    font-weight:900;
    font-size:14px;
}

.logo{
    width:55px;
    height:55px;
    filter:drop-shadow(0 0 15px rgba(245,196,81,.55));
    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px) rotate(-2deg)}
}

nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:5px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:8px 11px;
    border-radius:10px;
    transition:.3s;
}

nav a:hover{
    color:var(--gold);
    background:rgba(255,255,255,.08);
}

/* UMUMIY */

section{
    max-width:1200px;
    margin:auto;
    padding:85px 18px;
}

h2{
    text-align:center;
    font-size:clamp(30px,5vw,45px);
    margin-bottom:30px;
}

.lead{
    max-width:850px;
    margin:-10px auto 40px;
    text-align:center;
    color:var(--gray);
    font-size:17px;
}

/* HERO */

.hero{
    min-height:88vh;
    display:grid;
    place-items:center;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border:1px solid rgba(245,196,81,.5);
    border-radius:50px;
    color:var(--gold);
    box-shadow:0 0 30px rgba(245,196,81,.12);
}

.hero h1{
    font-size:clamp(40px,8vw,85px);
    line-height:1;
    margin:22px 0;

    background:
    linear-gradient(
        90deg,
        white,
        var(--gold),
        white,
        var(--gold2)
    );

    background-size:300%;
    color:transparent;
    background-clip:text;
    -webkit-background-clip:text;

    animation:titleShine 6s linear infinite;
}

@keyframes titleShine{
    to{
        background-position:300%;
    }
}

.hero p{
    max-width:800px;
    margin:20px auto;
    color:var(--gray);
    font-size:19px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:13px;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    display:inline-block;
    padding:14px 22px;
    border-radius:13px;
    text-decoration:none;
    font-weight:bold;
    color:#111827;
    background:var(--gold);
    box-shadow:0 10px 35px rgba(245,196,81,.20);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 45px rgba(245,196,81,.35);
}

.btn.alt{
    color:white;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(225px,1fr));
    gap:20px;
}

.card{
    padding:26px;
    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        rgba(16,35,60,.95),
        rgba(7,18,32,.95)
    );

    border:1px solid var(--line);

    box-shadow:0 15px 40px rgba(0,0,0,.25);

    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(245,196,81,.55);
    box-shadow:0 25px 55px rgba(0,0,0,.5);
}

.icon{
    font-size:36px;
}

.card h3{
    color:var(--gold);
    margin:12px 0;
}

.card p{
    color:var(--gray);
}

/* TIMELINE */

.timeline{
    max-width:850px;
    margin:auto;
    border-left:2px solid rgba(245,196,81,.45);
    padding-left:25px;
}

.timeline-item{
    margin:28px 0;
}

.timeline-item b{
    color:var(--gold);
    font-size:20px;
}

/* RUHLANTIRUVCHI QISM */

.motivation{
    text-align:center;
}

.quote{
    max-width:950px;
    margin:auto;
    font-size:clamp(26px,4.5vw,47px);
    font-weight:900;
}

.quote span{
    color:var(--gold);
}

.motivation-text{
    max-width:800px;
    margin:30px auto;
    color:var(--gray);
    font-size:18px;
}

/* STATISTIKA */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
    margin-top:35px;
}

.stat{
    text-align:center;
    padding:25px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(255,255,255,.04);
}

.stat strong{
    display:block;
    font-size:32px;
    color:var(--gold);
}

/* FOOTER */

footer{
    text-align:center;
    padding:40px 18px;
    color:var(--gray);
    border-top:1px solid var(--line);
}

footer strong{
    color:var(--gold);
}

/* MOBIL */

@media(max-width:720px){

    .navbar{
        flex-direction:column;
        align-items:center;
    }

    .brand{
        text-align:center;
    }

    nav{
        width:100%;
    }

    nav a{
        font-size:13px;
        padding:7px 8px;
    }

    .hero{
        min-height:80vh;
    }

    section{
        padding:60px 15px;
    }

}
</style>
