  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #071b35;
      padding: 15px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #f5b400;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #f5b400;
    }

    /* HERO */

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background:
        linear-gradient(rgba(3,19,39,.88), rgba(3,19,39,.88)),
        linear-gradient(135deg,#0b3d73,#071b35);
      color: white;
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #f5b400;
    }

    .hero p {
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 30px;
      color: #e5eaf2;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      margin: 7px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .btn-main {
      background: #f5b400;
      color: #071b35;
    }

    .btn-main:hover {
      transform: translateY(-3px);
      background: #ffd35a;
    }

    .btn-outline {
      border: 1px solid white;
      color: white;
    }

    .btn-outline:hover {
      background: white;
      color: #071b35;
    }

    /* SECTION */

    section {
      padding: 75px 6%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 34px;
      color: #071b35;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #64748b;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      transition: .3s;
      border-top: 4px solid #f5b400;
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 30px rgba(0,0,0,.13);
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 12px;
      color: #071b35;
    }

    .card p {
      line-height: 1.6;
      color: #64748b;
    }

    /* ABOUT */

    .about {
      background: white;
    }

    .about-box {
      max-width: 1000px;
      margin: auto;
      text-align: center;
      line-height: 1.8;
      color: #475569;
      font-size: 17px;
    }

    /* STATS */

    .stats {
      background: #071b35;
      color: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap: 25px;
      text-align: center;
    }

    .stat h3 {
      font-size: 38px;
      color: #f5b400;
    }

    .stat p {
      margin-top: 8px;
    }
