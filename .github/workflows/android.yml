name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Java o‘rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android loyihasini tayyorlash
        run: |
          mkdir -p app/src/main/java/uz/muzaffar/globaltrade
          mkdir -p app/src/main/res/values
          echo "Android loyiha tayyorlanmoqda"

      - name: Fayllarni tekshirish
        run: |
          echo "MUZAFFAR GLOBAL TRADE UZ"
          echo "Android APK tayyorlash jarayoni boshlandi"
